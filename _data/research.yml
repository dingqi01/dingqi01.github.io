areas:
  - number: "01"
    title: "Transport energy systems"
    short: "Large-scale optimization of technology, fuel, and infrastructure choices for passenger and freight mobility."
    detail: >-
      I study how transport demand, vehicle technologies, energy carriers, and infrastructure
      evolve together on the path to net-zero emissions. The work considers not only direct
      energy use and emissions, but also upstream energy, fleet turnover, and material demand.

  - number: "02"
    title: "Electric mobility and power systems"
    short: "Charging, vehicle-to-grid flexibility, and resilience at the transport–power interface."
    detail: >-
      This research connects electric-vehicle behavior and charging infrastructure with power-system
      operations and planning. It asks when flexible charging can create reliable system value and
      how that value changes across locations, transition pathways, and climate conditions.

  - number: "03"
    title: "Hydrogen and low-carbon fuels"
    short: "Infrastructure and fuel choices for transport applications that are harder to electrify."
    detail: >-
      I evaluate hydrogen and hydrogen-derived fuels for long-distance transport, ports, and airports,
      combining spatial infrastructure analysis with techno-economic assessment to examine where
      production, transport, and demand can be coordinated effectively.

  - number: "04"
    title: "Energy systems modeling and optimization"
    short: "Formulation, decomposition, and efficient solution of coupled large-scale system models."
    detail: >-
      I develop and connect optimization, integrated-assessment, and data-driven models to examine
      interactions among end-use transitions, power systems, climate stress, and long-term policy.
      The emphasis is on transparent boundaries and evidence that can inform real infrastructure decisions.

programme:
  statement: >-
    I develop and solve large-scale optimization models of power and energy systems.
    The emphasis is on mathematical formulation, solution methods, and computational
    tractability for planning, operations, and infrastructure problems.
  stages:
    - number: "01"
      title: "End-use transitions"
      short: "Demand, mobility, and technology pathways"
      detail: >-
        I examine how evolving mobility demand, shared autonomous mobility, vehicle technologies,
        and fleet turnover reshape energy use, emissions, material requirements, and retired-battery availability.

    - number: "02"
      title: "Infrastructure and supply chains"
      short: "Production, conversion, transport, and spatial coordination"
      detail: >-
        I model where hydrogen and hydrogen-derived fuels could be produced, converted, and moved
        to demand centers such as ports and airports, while keeping resource, cost, and network constraints explicit.

    - number: "03"
      title: "Power-system integration and resilience"
      short: "Hourly operations, flexibility, and climate stress"
      detail: >-
        I evaluate how EV charging, smart charging, vehicle-to-grid operation, electrolysis, and extreme-weather
        conditions interact with generation, storage, transmission, and system adequacy.

current:
  - status: "Working paper"
    title: "EV flexibility and power-system resilience under climate stress"
    question: >-
      How do historically grounded extreme-weather events alter operational stress in a future power system,
      and when can smart charging or vehicle-to-grid operation provide credible resilience value?
    methods: "Climate-stress event construction · fixed-capacity system replay · PyPSA-China"

  - status: "Research in progress"
    title: "Spatial supply chains for hydrogen-derived fuels"
    question: >-
      Where should hydrogen, ammonia, methanol, and sustainable-aviation-fuel equivalents be produced,
      and how should strategic transport infrastructure evolve as demand changes across China?
    methods: "GIS · multi-period mixed-integer optimization · techno-economic analysis"

  - status: "Model development"
    title: "Charging-infrastructure retrofit planning"
    question: >-
      How should photovoltaic generation and battery storage be sized across heterogeneous public charging stations,
      and how do economic and lifecycle-emissions objectives change the preferred deployment strategy?
    methods: "Station-level data · capacity sizing · lifecycle and techno-economic assessment"

  - status: "Method development"
    title: "Coupling long-term pathways with hourly power-system analysis"
    question: >-
      How can national and provincial transition scenarios be translated into spatially and temporally explicit
      power-system inputs without losing traceability across model boundaries?
    methods: "China TIMES · PyPSA-China · Python-based scenario interfaces and quality assurance"

toolkit:
  - name: "Long-term transition modeling"
    tools: "China TIMES 2.0 and China TIMES-30PE"
    purpose: "National and provincial pathways, technology change, and cross-sector interactions."

  - name: "Power-system analysis"
    tools: "PyPSA-China"
    purpose: "Hourly system operation, investment, flexibility, and regional coordination."

  - name: "Spatial infrastructure"
    tools: "GIS and network optimization"
    purpose: "Node-level demand and supply, transport links, candidate corridors, and regional heterogeneity."

  - name: "Decision models"
    tools: "Linear and mixed-integer optimization"
    purpose: "Technology choice, capacity planning, logistics, and operational constraints."

  - name: "Research computing"
    tools: "Python, GAMS, and reproducible scenario workflows"
    purpose: "Data preparation, model orchestration, quality assurance, analysis, and visualization."
